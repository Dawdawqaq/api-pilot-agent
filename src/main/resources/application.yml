spring:
  application:
    name: dochelper
  profiles:
    default: local,stub
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
  codec:
    max-in-memory-size: 11MB

server:
  port: 8080
  shutdown: graceful

dochelper:
  secret-store:
    master-key: ${SECRET_STORE_MASTER_KEY:}
  ai:
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:qwen-plus}
    embedding-base-url: ${AI_EMBEDDING_BASE_URL:}
    embedding-api-key: ${AI_EMBEDDING_API_KEY:}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:}
  storage:
    enabled: false
    endpoint: http://localhost:9000
    access-key: dochelper
    secret-key: dochelper-local-secret
    bucket: dochelper-files
    verify-on-startup: true
  infrastructure:
    qdrant-health-enabled: false
    qdrant-http-url: http://localhost:6333
    qdrant-collection: dochelper_knowledge
  openapi:
    max-file-size-bytes: 5242880
  knowledge:
    max-file-size-bytes: 10485760
    max-extracted-characters: 500000
    chunk-size: 800
    chunk-overlap: 120
    retrieval-candidate-size: 20
    rrf-rank-constant: 60
  executor:
    connect-timeout: 3s
    response-timeout: 10s
    max-response-size-bytes: 1048576
    max-request-size-bytes: 524288
    max-steps: 10
    max-step-retries: 2
    retry-backoff: 200ms
    sensitive-name-pattern: "(?i).*(authorization|token|password|secret|credential|session|cookie|api[-_]?key|email|phone|mobile).*"
  agent:
    max-steps: 10
    max-tool-calls: 30
    max-replans: 2
    max-plan-modifications: 3
    max-tool-retries: 2
    # 总墙钟预算包括用户等待；待确认期限不得晚于任务截止时间。
    task-timeout: 15m
    confirmation-timeout: 10m
    event-poll-interval: 500ms
    lease-duration: 30s
    max-total-model-tokens: 20000
    default-endpoint-top-k: 12
    # 单用户工具仍限制任务并发，避免误操作堆积模型调用和写请求。
    max-concurrent-tasks: 4
    max-concurrent-tasks-per-project: 2
    task-queue-capacity: 8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    defaults:
      enabled: true
