spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/dochelper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:dochelper}
    password: ${DB_PASSWORD:dochelper-local}
    hikari:
      pool-name: DocHelperHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
      client-name: dochelper
  ai:
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:qdrant}
        port: ${QDRANT_GRPC_PORT:6334}
        use-tls: false
        collection-name: dochelper_knowledge
        initialize-schema: true

dochelper:
  storage:
    enabled: true
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:dochelper}
    secret-key: ${MINIO_SECRET_KEY:dochelper-local-secret}
    bucket: ${MINIO_BUCKET:dochelper-files}
  infrastructure:
    qdrant-health-enabled: true
    qdrant-http-url: ${QDRANT_HTTP_URL:http://qdrant:6333}
    qdrant-collection: dochelper_knowledge
