services:
  apipilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apipilot-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker,stub
      - DB_URL=jdbc:mysql://mysql:3306/dochelper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME:-dochelper}
      - DB_PASSWORD=${DB_PASSWORD:-dochelper_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_GRPC_PORT=6334
      - QDRANT_HTTP_URL=http://qdrant:6333
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-dochelper}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-dochelper-local-secret}
      - MINIO_BUCKET=dochelper-files
      - SECRET_STORE_MASTER_KEY=${SECRET_STORE_MASTER_KEY:-default-dev-master-key-DO-NOT-USE-IN-PROD}
      - AI_BASE_URL=${AI_BASE_URL:}
      - AI_API_KEY=${AI_API_KEY:}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:qwen-plus}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:deterministic-local}
      - AI_EMBEDDING_BASE_URL=${AI_EMBEDDING_BASE_URL:}
      - AI_EMBEDDING_API_KEY=${AI_EMBEDDING_API_KEY:}
      - AI_EMBEDDING_DIMENSIONS=${AI_EMBEDDING_DIMENSIONS:}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.0.36
    container_name: apipilot-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=dochelper
      - MYSQL_USER=${DB_USERNAME:-dochelper}
      - MYSQL_PASSWORD=${DB_PASSWORD:-dochelper_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: apipilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: apipilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: apipilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-dochelper}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-dochelper-local-secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: apipilot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-dochelper} $${MINIO_SECRET_KEY:-dochelper-local-secret};
      /usr/bin/mc mb --ignore-existing myminio/dochelper-files;
      exit 0;
      "

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  minio_data:
